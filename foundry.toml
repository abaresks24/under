[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
via_ir = true          # v4-periphery (PositionManager/V4Quoter) overflow the stack without IR
memory_limit = 3221225472  # HookMiner brute-forces salts in a loop; give the script EVM headroom (3 GB)
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "v4-core/=lib/v4-core/",
    "v4-periphery/=lib/v4-periphery/",
    "@uniswap/v4-core/=lib/v4-core/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 110

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
